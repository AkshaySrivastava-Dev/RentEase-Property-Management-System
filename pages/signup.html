<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — RentEase</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="../index.html" class="brand-logo">
      <div class="brand-logo-icon">R</div>
      <div class="brand-logo-text">RentEase</div>
    </a>
    <div>
      <span class="text-sm text-secondary">Already registered?</span>
      <a href="login.html" class="text-sm font-semibold text-primary" style="margin-left: 6px;">Sign In</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Join RentEase</h1>
        <p class="auth-card-subtitle">Create your account to start managing or leasing properties</p>
      </div>

      <div id="signup-error-alert" style="display: none; background: var(--color-danger-light); color: var(--color-danger-text); padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: var(--space-4); border: 1px solid rgba(220, 38, 38, 0.2);">
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group" id="group-name">
          <label for="signup-name" class="form-label required">Full Name</label>
          <input
            type="text"
            id="signup-name"
            class="form-control"
            placeholder="e.g. Priya Sharma"
            required
          >
          <div class="invalid-feedback" id="feedback-name">Please enter your full name.</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signup-email" class="form-label required">Email Address</label>
            <input
              type="email"
              id="signup-email"
              class="form-control"
              placeholder="name@example.com"
              required
            >
            <div class="invalid-feedback" id="feedback-email">Please enter a valid email.</div>
          </div>

          <div class="form-group">
            <label for="signup-phone" class="form-label">Phone Number</label>
            <input
              type="tel"
              id="signup-phone"
              class="form-control"
              placeholder="+91 98765 43210"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="signup-role" class="form-label required">I am a</label>
          <select id="signup-role" class="form-control">
            <option value="tenant" selected>Tenant / Resident</option>
            <option value="admin">Property Manager / Landlord (Admin)</option>
          </select>
          <span class="form-helper">Choose Tenant to access leased units, or Admin to manage properties.</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signup-password" class="form-label required">Password</label>
            <input
              type="password"
              id="signup-password"
              class="form-control"
              placeholder="Min. 6 characters"
              required
            >
            <div class="invalid-feedback" id="feedback-password">Must be at least 6 characters.</div>
          </div>

          <div class="form-group">
            <label for="signup-confirm-password" class="form-label required">Confirm Password</label>
            <input
              type="password"
              id="signup-confirm-password"
              class="form-control"
              placeholder="Re-enter password"
              required
            >
            <div class="invalid-feedback" id="feedback-confirm-password">Passwords do not match.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signup-submit-btn" style="margin-top: var(--space-4);">
          Create Account
        </button>
      </form>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/storage/storage.js"></script>
  <script src="../js/data/seedData.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/signup.js"></script>
</body>
</html>
