<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details — RentEase</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/globals.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <div id="navbar-container"></div>

      <main class="main-content">
        <div style="margin-bottom: var(--space-4);">
          <a href="properties.html" class="btn btn-ghost btn-sm text-secondary" style="padding-left: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back to Properties</span>
          </a>
        </div>

        <div class="page-header" id="property-detail-header">
          <div class="page-header-info">
            <div class="flex items-center gap-3">
              <h1 class="page-header-title" id="prop-detail-title">Loading...</h1>
              <span id="prop-detail-status-badge"></span>
            </div>
            <p class="page-header-desc" id="prop-detail-address"></p>
          </div>
          <div class="page-header-actions">
            <button type="button" class="btn btn-secondary" id="btn-edit-current-prop">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              <span>Edit Property</span>
            </button>
            <a href="leases.html" class="btn btn-primary" id="btn-assign-lease-link">
              <span>Create Lease for Unit</span>
            </a>
          </div>
        </div>

        <!-- Property Hero and Key Attributes -->
        <div class="dashboard-sections-grid" style="margin-bottom: var(--space-8);">
          <!-- Left: Big Image & Amenities -->
          <div class="card">
            <div style="height: 320px; overflow: hidden; background: #e2e8f0;">
              <img id="prop-detail-img" src="" alt="Property Photo" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="card-body">
              <h3 style="margin-bottom: var(--space-3); font-size: 1.1rem;">Included Amenities & Features</h3>
              <div id="prop-detail-amenities" class="flex gap-2" style="flex-wrap: wrap;">
                <!-- Rendered via JS -->
              </div>
            </div>
          </div>

          <!-- Right: Key Specs & Current Lease Snapshot -->
          <div style="display: flex; flex-direction: column; gap: var(--space-6);">
            <!-- Specs Card -->
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Property Highlights</h3>
              </div>
              <div class="card-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
                <div class="flex items-center justify-between" style="border-bottom: 1px solid var(--color-border); padding-bottom: 10px;">
                  <span class="text-sm text-secondary">Monthly Rent</span>
                  <span class="text-lg font-bold text-primary" id="prop-detail-rent">₹0</span>
                </div>
                <div class="flex items-center justify-between" style="border-bottom: 1px solid var(--color-border); padding-bottom: 10px;">
                  <span class="text-sm text-secondary">Unit Type</span>
                  <span class="text-sm font-semibold" id="prop-detail-type">—</span>
                </div>
                <div class="flex items-center justify-between" style="border-bottom: 1px solid var(--color-border); padding-bottom: 10px;">
                  <span class="text-sm text-secondary">Layout</span>
                  <span class="text-sm font-semibold" id="prop-detail-rooms">—</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-sm text-secondary">City / Region</span>
                  <span class="text-sm font-semibold" id="prop-detail-city">—</span>
                </div>
              </div>
            </div>

            <!-- Current Lease & Tenant Card -->
            <div class="card" id="prop-lease-card">
              <div class="card-header">
                <h3 class="card-title">Active Lease & Resident</h3>
              </div>
              <div class="card-body" id="prop-lease-card-body">
                <!-- Rendered via JS -->
              </div>
            </div>
          </div>
        </div>

        <!-- Property Maintenance & Unit History -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Maintenance Tickets for this Property</h3>
          </div>
          <div class="card-body" style="padding: 0;">
            <div id="prop-maintenance-table-container"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="../../js/utils/constants.js"></script>
  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/utils/validators.js"></script>
  <script src="../../js/storage/storage.js"></script>
  <script src="../../js/data/seedData.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/services/propertyService.js"></script>
  <script src="../../js/services/tenantService.js"></script>
  <script src="../../js/services/leaseService.js"></script>
  <script src="../../js/services/paymentService.js"></script>
  <script src="../../js/services/maintenanceService.js"></script>
  <script src="../../js/services/messageService.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/navbar.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/table.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/pages/admin/property-details.js"></script>
</body>
</html>
