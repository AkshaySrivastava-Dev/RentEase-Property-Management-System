<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Invoices & Payments — RentEase</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/globals.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="app-main">
      <div id="navbar-container"></div>

      <main class="main-content">
        <div class="page-header">
          <div class="page-header-info">
            <h1 class="page-header-title">Payment History & Dues</h1>
            <p class="page-header-desc">Review your monthly rent statements, pending payments, and receipts.</p>
          </div>
        </div>

        <!-- Tenant Payments KPI Summary -->
        <div class="metrics-grid" style="margin-bottom: var(--space-6);">
          <div class="metric-card">
            <div class="metric-info">
              <span class="metric-label">Total Rent Paid</span>
              <span class="metric-value text-success" id="tenant-pay-total-paid">₹0</span>
              <span class="metric-subtext">Lifetime payments settled</span>
            </div>
            <div class="metric-icon-box metric-icon-green">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-info">
              <span class="metric-label">Outstanding Balance</span>
              <span class="metric-value text-primary" id="tenant-pay-pending-balance">₹0</span>
              <span class="metric-subtext" id="tenant-pay-pending-sub">No pending dues</span>
            </div>
            <div class="metric-icon-box metric-icon-amber">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <select id="filter-tenant-pay-status" class="form-control" style="width: auto; min-width: 140px;">
              <option value="All">All Invoices</option>
              <option value="Paid">Paid</option>
              <option value="Pending">Pending</option>
              <option value="Overdue">Overdue</option>
            </select>
          </div>
        </div>

        <!-- Payments Table -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div id="tenant-payments-table-container"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="../../js/utils/constants.js"></script>
  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/utils/validators.js"></script>
  <script src="../../js/storage/storage.js"></script>
  <script src="../../js/data/seedData.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/services/propertyService.js"></script>
  <script src="../../js/services/tenantService.js"></script>
  <script src="../../js/services/leaseService.js"></script>
  <script src="../../js/services/paymentService.js"></script>
  <script src="../../js/services/maintenanceService.js"></script>
  <script src="../../js/services/messageService.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/navbar.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/table.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/pages/tenant/payments.js"></script>
</body>
</html>
