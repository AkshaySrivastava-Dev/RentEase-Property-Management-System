<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RentEase</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">

  <header class="auth-header">
    <a href="../index.html" class="brand-logo">
      <div class="brand-logo-icon">R</div>
      <div class="brand-logo-text">RentEase</div>
    </a>
    <div>
      <span class="text-sm text-secondary">Don't have an account?</span>
      <a href="signup.html" class="text-sm font-semibold text-primary" style="margin-left: 6px;">Sign Up</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Welcome Back</h1>
        <p class="auth-card-subtitle">Sign in to your RentEase property portal</p>
      </div>

      <div id="login-error-alert" style="display: none; background: var(--color-danger-light); color: var(--color-danger-text); padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: var(--space-4); border: 1px solid rgba(220, 38, 38, 0.2);">
      </div>

      <form id="login-form" novalidate>
        <div class="form-group" id="group-email">
          <label for="login-email" class="form-label required">Email Address</label>
          <input
            type="email"
            id="login-email"
            class="form-control"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
          <div class="invalid-feedback" id="feedback-email">Please enter a valid email address.</div>
        </div>

        <div class="form-group" id="group-password">
          <label for="login-password" class="form-label required">Password</label>
          <input
            type="password"
            id="login-password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <div class="invalid-feedback" id="feedback-password">Password is required.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn" style="margin-top: var(--space-3);">
          Sign In
        </button>
      </form>

      <!-- Quick autofill helpers for testing -->
      <div style="margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--color-border); text-align: center;">
        <p class="text-xs text-muted" style="margin-bottom: var(--space-3);">TESTING CREDENTIALS AUTOFILL</p>
        <div class="flex items-center justify-center gap-2">
          <button type="button" class="btn btn-secondary btn-sm" id="autofill-admin-btn">
            Admin Account
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="autofill-tenant-btn">
            Tenant Account
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/storage/storage.js"></script>
  <script src="../js/data/seedData.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
